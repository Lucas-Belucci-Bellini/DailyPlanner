spring.application.name=DailyPlanner

# Banco H2 gravado em arquivo dentro da pasta ./dados, entao a agenda continua la
# depois que a aplicacao e fechada. Para rodar sem deixar rastro, troque por:
# spring.datasource.url=jdbc:h2:mem:dailyplanner
spring.datasource.url=jdbc:h2:file:./dados/dailyplanner
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria e atualiza a tabela a partir da classe Horario.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 (para espiar a tabela). Fica desligado por padrao; para ligar:
# ./mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.h2.console.enabled=true
# e abra http://localhost:8080/h2-console com a URL jdbc:h2:file:./dados/dailyplanner
spring.h2.console.enabled=false

# Paginas em portugues do Brasil.
spring.web.locale=pt-BR
spring.web.locale-resolver=fixed

server.port=8080

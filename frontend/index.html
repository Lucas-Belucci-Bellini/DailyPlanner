<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyPlanner</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f4f4f9; padding:20px }
      .container{max-width:720px;margin:0 auto;background:#fff;padding:20px;border-radius:8px}
      input,button,textarea{width:100%;padding:8px;margin:6px 0}
      button{background:#2563eb;color:#fff;border:none;padding:10px;border-radius:6px}
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DailyPlanner</h1>
      <form id="formHorario">
        <label>Título</label>
        <input id="titulo" required />
        <label>Data</label>
        <input id="data" type="date" required />
        <label>Hora inicio</label>
        <input id="horaInicio" type="time" required />
        <label>Hora fim</label>
        <input id="horaFim" type="time" />
        <button type="submit">Salvar</button>
      </form>

      <div style="margin-top:20px">
        <h2>Minhas Tarefas</h2>
        <div id="listaTarefas">Carregando...</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

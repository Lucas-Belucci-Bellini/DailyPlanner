name: Testes

# Roda a bateria de testes a cada push e em toda pull request. É este o check
# verde que significa alguma coisa no projeto: ele compila o Java e executa os
# testes de verdade.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compilar e testar
        run: ./mvnw -B --no-transfer-progress verify

      # O relatório fica disponível mesmo quando a bateria falha — é justamente
      # aí que alguém precisa abrir para ver qual teste quebrou.
      - name: Guardar o relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-surefire
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

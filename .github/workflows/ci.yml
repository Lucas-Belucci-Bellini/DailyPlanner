name: Testes

# Roda a bateria e o build a cada push e em toda pull request. É este o check
# verde que significa alguma coisa no projeto.

on:
  # Só `main` no gatilho de push. Um branch com pull request aberta já é coberto
  # pelo gatilho `pull_request`; listar "**" aqui faria os dois dispararem e a
  # PR apareceria com dois checks idênticos rodando lado a lado.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

# Push novo na mesma referência cancela a execução anterior, que já ficou obsoleta.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      # O build entra na bateria de propósito: ele roda o compilador do
      # TypeScript e o lint sobre o projeto inteiro. Sem este passo, um erro de
      # tipo numa página passaria pelos testes (que só cobrem `lib/`) e só
      # apareceria na hora de publicar.
      - name: Compilar para produção
        run: npm run build
